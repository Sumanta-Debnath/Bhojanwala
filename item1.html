<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biryani &amp; Rolls | Bhojanwala</title>
    <script>
      // Apply stored/system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("bhojanwala-theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/item1.tsx"></script>
  </body>
</html>
